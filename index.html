<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quill Web</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: glass sidebar (scripts) + glass toolbar over a soft desk; white Courier page centred. */
:root{
  --desk:#e7eaf0; --desk2:#d9dee8; --glass:rgba(255,255,255,.62); --glass-line:rgba(255,255,255,.75);
  --ink:#1d2230; --muted:#5d6577; --accent:#3a63c7; --accent-soft:rgba(58,99,199,.12);
  --page:#fffffe; --page-ink:#111; --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 28px rgba(20,30,50,.10);
  --ui:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif; --mono:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#171a21; --desk2:#11141a; --glass:rgba(40,45,56,.62); --glass-line:rgba(255,255,255,.08);
  --ink:#e6e9f0; --muted:#9aa2b3; --accent:#8aa8ff; --accent-soft:rgba(138,168,255,.14);
  --page:#f6f5f1; --page-ink:#111; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#171a21; --desk2:#11141a; --glass:rgba(40,45,56,.62); --glass-line:rgba(255,255,255,.08);
  --ink:#e6e9f0; --muted:#9aa2b3; --accent:#8aa8ff; --accent-soft:rgba(138,168,255,.14);
  --page:#f6f5f1; --page-ink:#111; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--desk),var(--desk2));color:var(--ink);font:13px/1.45 var(--ui);overflow:hidden}
.app{display:grid;grid-template-columns:230px 1fr;height:100%;gap:12px;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--glass-line);border-radius:14px;box-shadow:var(--shadow)}
aside{display:flex;flex-direction:column;min-height:0;padding:12px;gap:10px}
aside h1{font:600 15px var(--ui);margin:2px 4px 0;letter-spacing:.01em}
aside .sub{color:var(--muted);font-size:12px;margin:0 4px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.item{padding:7px 9px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column}
.item:hover{background:var(--accent-soft)}
.item.on{background:var(--accent-soft);color:var(--accent)}
.item small{color:var(--muted);font-size:11px}
button,select{font:500 12.5px var(--ui);color:var(--ink);background:transparent;border:1px solid var(--glass-line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{background:var(--accent-soft)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:#fff;border-color:transparent}
.main{display:flex;flex-direction:column;min-height:0;min-width:0;gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px}
#title{flex:1;min-width:140px;font:600 14px var(--ui);color:var(--ink);background:transparent;border:0;padding:4px 6px;border-radius:6px}
#status{color:var(--muted);font-size:12px;min-width:70px;text-align:right}
.desk{flex:1;overflow:auto;padding:8px 0 80px}
.page{background:var(--page);color:var(--page-ink);width:8.5in;max-width:100%;min-height:11in;margin:0 auto;box-sizing:border-box;padding:1in 1in 1in 1.5in;box-shadow:var(--shadow);border-radius:3px}
#ed{outline:none;font:12pt/1 var(--mono);caret-color:#000}
#ed p{margin:0;min-height:1em;line-height:1;white-space:pre-wrap;position:relative}
#ed p[data-t=scene]{text-transform:uppercase;font-weight:700;margin-top:2em}
#ed p[data-t=scene]:first-child{margin-top:0}
#ed p[data-t=action]{margin-top:1em}
#ed p[data-t=character]{text-transform:uppercase;margin-top:1em;margin-left:2in}
#ed p[data-t=paren]{margin-left:1.5in;margin-right:2in}
#ed p[data-t=dialogue]{margin-left:1in;margin-right:1.5in}
#ed p[data-t=transition]{text-transform:uppercase;margin-top:1em;text-align:right}
#ed p.cur::before{content:attr(data-label);position:absolute;right:calc(100% + .35in);top:0;font:500 10.5px var(--ui);color:#8a90a0;white-space:nowrap;text-transform:none}
#ed p[data-t=character].cur::before{right:calc(100% + 2.35in)}
#ed p[data-t=paren].cur::before{right:calc(100% + 1.85in)}
#ed p[data-t=dialogue].cur::before{right:calc(100% + 1.35in)}
#pop{position:fixed;z-index:20;min-width:180px;max-width:300px;padding:4px;font:12.5px var(--ui)}
#pop div{padding:5px 9px;border-radius:6px;cursor:pointer}
#pop div.on{background:var(--accent);color:#fff}
#pop .hint{color:var(--muted);font-size:11px;padding:4px 9px 2px;cursor:default}
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.sheet .box{width:min(640px,100%);padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet textarea{width:100%;height:50vh;box-sizing:border-box;font:12px/1.4 var(--mono);background:var(--page);color:var(--page-ink);border:1px solid var(--glass-line);border-radius:8px;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.row .grow{flex:1;color:var(--muted);font-size:12px}
.field{font:13px var(--ui);padding:8px 10px;border-radius:8px;border:1px solid var(--glass-line);background:var(--page);color:var(--page-ink)}
.keys{color:var(--muted);font-size:11.5px;line-height:1.6;margin:0 4px}
kbd{font:11px var(--ui);border:1px solid var(--glass-line);border-radius:4px;padding:0 4px}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:150px}.page{padding:.6in .5in .6in .7in}.field{font:13px var(--ui);padding:8px 10px;border-radius:8px;border:1px solid var(--glass-line);background:var(--page);color:var(--page-ink)}
.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="app">
  <aside class="glass">
    <h1>Quill</h1>
    <p class="sub" id="where">Loading your scripts…</p>
    <button class="primary" id="new">New script</button>
    <button id="acct">Account</button>
    <div id="list"></div>
    <p class="keys"><kbd>Return</kbd> next element · <kbd>Tab</kbd> change type · <kbd>Ctrl/⌘ 1–6</kbd> set type · <kbd>Ctrl/⌘ Z</kbd> undo</p>
  </aside>
  <section class="main">
    <div class="bar glass">
      <input id="title" aria-label="Script title" placeholder="Untitled Screenplay">
      <select id="type" aria-label="Element type">
        <option value="scene">Scene Heading</option><option value="action">Action</option><option value="character">Character</option>
        <option value="paren">Parenthetical</option><option value="dialogue">Dialogue</option><option value="transition">Transition</option>
      </select>
      <button id="undo" title="Undo">Undo</button><button id="redo" title="Redo">Redo</button>
      <button id="imp">Import Fountain</button><button id="exp">Export Fountain</button><button id="del">Delete</button>
      <span id="status"></span>
    </div>
    <div class="desk"><div class="page"><div id="ed" contenteditable="true" spellcheck="true" aria-label="Screenplay"></div></div></div>
  </section>
</div>
<div id="pop" class="glass" hidden></div>
<div id="sheet" class="sheet" hidden><div class="box glass">
  <strong id="shTitle">Fountain</strong>
  <textarea id="shText" spellcheck="false"></textarea>
  <div class="row"><span class="grow" id="shNote"></span>
    <input type="file" id="file" accept=".fountain,.txt,.spmd,text/plain" hidden>
    <button id="shFile">Open file…</button><button id="shCopy">Copy</button><button id="shSave">Download</button>
    <button id="shCancel">Close</button><button class="primary" id="shOk">Import as new script</button></div>
</div></div>
<div id="auth" class="sheet" hidden><div class="box glass" style="max-width:380px">
  <strong>Sign in to sync with Quill for Mac</strong>
  <span class="grow" style="color:var(--muted);font-size:12px">Use the same email and password in Quill for Mac (sync dot in the toolbar → Quill Web Sync). On a shared school computer, sign out when you leave.</span>
  <input id="auEmail" type="email" placeholder="Email" autocomplete="username" class="field">
  <input id="auPw" type="password" placeholder="Password" autocomplete="current-password" class="field">
  <span id="auNote" style="font-size:12px;color:var(--muted)"></span>
  <div class="row"><button id="auOut">Sign out</button><button id="auLater">Not now</button><button id="auNew">Create account</button><button class="primary" id="auIn">Sign in</button></div>
</div></div>
<div id="confirm" class="sheet" hidden><div class="box glass"><span id="cfText"></span><div class="row"><button id="cfNo">Cancel</button><button class="primary" id="cfYes">Delete</button></div></div></div>

<script>
const TYPES=["scene","action","character","paren","dialogue","transition"];
const LABEL={scene:"Scene Heading",action:"Action",character:"Character",paren:"Parenthetical",dialogue:"Dialogue",transition:"Transition"};
const NEXT={scene:"action",action:"action",character:"dialogue",paren:"dialogue",dialogue:"action",transition:"scene"};
const TIMES=["DAY","NIGHT","MORNING","AFTERNOON","EVENING","DUSK","DAWN","LATER","CONTINUOUS","MOMENTS LATER"];
const TRANS=["CUT TO:","FADE OUT.","FADE IN:","DISSOLVE TO:","SMASH CUT TO:","MATCH CUT TO:","FADE TO BLACK."];
const PREFIX=["INT. ","EXT. ","INT./EXT. "];
const $=id=>document.getElementById(id), ed=$("ed");
let scripts={}, curId=null, db=null, uid=null, saveT=null, undoS=[], redoS=[], snapT=null;

/* ---------- storage: browser cache + Supabase (same project as Quill for Mac) ---------- */
const SB="https://tcjkjxvzpzwbkovicrhu.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjamtqeHZ6cHp3Ymtvdmljcmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NjYyOTMsImV4cCI6MjExMDU0MjI5M30.NfZF45AiOVDKKJON7ijjjXmZX5jSUoLInp4EulBuIjs";
const LS="quill-web-scripts", LSS="quill-web-session";
let sess=null;
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(scripts))}catch(e){}}
function sessSave(){try{sess?localStorage.setItem(LSS,JSON.stringify(sess)):localStorage.removeItem(LSS)}catch(e){}}
async function authCall(path,body){const r=await fetch(SB+"/auth/v1/"+path,{method:"POST",headers:{apikey:ANON,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||"Sign-in failed");return j}
function takeSess(j){sess={at:j.access_token,rt:j.refresh_token,exp:Date.now()+((j.expires_in||3600)-60)*1000,email:(j.user&&j.user.email)||(sess&&sess.email)};sessSave()}
async function token(){if(!sess)throw new Error("signed out");if(Date.now()<sess.exp)return sess.at;try{takeSess(await authCall("token?grant_type=refresh_token",{refresh_token:sess.rt}))}catch(e){sess=null;sessSave();showAuth();throw e}return sess.at}
async function rest(method,q,body,extra){const t=await token();const r=await fetch(SB+"/rest/v1/quill_scripts"+q,{method,headers:Object.assign({apikey:ANON,Authorization:"Bearer "+t,"Content-Type":"application/json"},extra||{}),body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json().catch(()=>null)}
function pack(s){return{id:s.id,title:s.title||"",fountain:s.fountain||"",updated_at:new Date(s.updated||Date.now()).toISOString()}}
async function pull(){
  if(!sess)return;
  try{
    const rows=await rest("GET","?select=id,title,fountain,updated_at");let changed=false;
    rows.forEach(r=>{const u=Date.parse(r.updated_at)||0,loc=scripts[r.id];
      if(!loc||u>(loc.updated||0)){ if(r.id===curId&&saveT)return; scripts[r.id]={id:r.id,title:r.title,fountain:r.fountain,updated:u};changed=true;
        if(r.id===curId){const st=state();undoS.push(st);$("title").value=r.title||"";loadModel(fromFountain(r.fountain||""))} }});
    for(const id in scripts){if(!rows.find(r=>r.id===id)&&scripts[id].dirty!==false)await rest("POST","?on_conflict=id",[pack(scripts[id])],{Prefer:"resolution=merge-duplicates,return=minimal"}).catch(()=>{})}
    lsSave();renderList();setWhere("Synced with Quill for Mac · "+(sess.email||""));if(changed&&!curId)render(true);
  }catch(e){setWhere("Offline – saved in this browser")}
}
async function boot(){
  scripts=lsLoad();try{sess=JSON.parse(localStorage.getItem(LSS)||"null")}catch(e){}
  render(true);
  if(sess){setWhere("Syncing…");await pull()}else{setWhere("Not signed in – saved in this browser only");showAuth()}
  setInterval(()=>{if(!document.hidden)pull()},30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
}
function setWhere(t){$("where").textContent=t}
function status(t){$("status").textContent=t}
function scheduleSave(){if(!curId)return;status("Editing…");clearTimeout(saveT);saveT=setTimeout(saveNow,1200)}
async function saveNow(){
  clearTimeout(saveT);saveT=null;if(!curId)return;
  const s=scripts[curId];s.fountain=toFountain(readModel());s.title=$("title").value.trim();s.updated=Date.now();
  lsSave();renderList();
  if(sess){try{await rest("POST","?on_conflict=id",[pack(s)],{Prefer:"resolution=merge-duplicates,return=minimal"});status("Saved")}catch(e){status("Saved in browser – sync failed")}}else status("Saved in browser");
}
addEventListener("beforeunload",()=>{if(saveT)saveNow()});
addEventListener("visibilitychange",()=>{if(document.hidden&&saveT)saveNow()});
/* sign-in sheet */
function showAuth(){$("auth").hidden=false;$("auEmail").value=(sess&&sess.email)||"";setTimeout(()=>$("auEmail").focus(),0)}
async function doAuth(create){
  const email=$("auEmail").value.trim(),pw=$("auPw").value;if(!email||pw.length<6){$("auNote").textContent="Enter your email and a password of at least 6 characters.";return}
  $("auNote").textContent=create?"Creating account…":"Signing in…";
  try{const j=await authCall(create?"signup":"token?grant_type=password",{email,password:pw});
    if(!j.access_token){$("auNote").textContent="Account created. Open the confirmation email from Supabase, click the link, then come back and sign in.";return}
    takeSess(j);sess.email=email;sessSave();$("auPw").value="";$("auth").hidden=true;await pull();
  }catch(e){$("auNote").textContent=/confirm/i.test(e.message)?"Confirm your email first: click the link Supabase emailed you.":e.message}
}
/* ---------- list ---------- */
function render(pick){ renderList(); if(pick||!curId){const ids=sorted(); if(!curId||!scripts[curId]) ids.length?open(ids[0]):newScript(); } }
function sorted(){return Object.keys(scripts).sort((a,b)=>(scripts[b].updated||0)-(scripts[a].updated||0))}
function renderList(){
  const L=$("list"); L.textContent="";
  sorted().forEach(id=>{const s=scripts[id],d=document.createElement("div");d.className="item"+(id===curId?" on":"");
    const b=document.createElement("span");b.textContent=s.title||"Untitled Screenplay";
    const m=document.createElement("small");m.textContent=new Date(s.updated||0).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    d.append(b,m);d.onclick=()=>{if(id!==curId){saveT&&saveNow();open(id)}};L.append(d)});
}
function open(id){curId=id;const s=scripts[id];$("title").value=s.title||"";loadModel(fromFountain(s.fountain||""));undoS=[];redoS=[];renderList();status("");focusEnd()}
function newScript(model,title){
  const id=(crypto.randomUUID?crypto.randomUUID():"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)).toUpperCase();
  scripts[id]={id,title:title||"",fountain:toFountain(model||[{t:"scene",x:""}]),updated:Date.now()};
  open(id); saveNow();
}
$("new").onclick=()=>{saveT&&saveNow();newScript()};
$("title").oninput=scheduleSave;
$("del").onclick=()=>{$("cfText").textContent=`Delete “${$("title").value||"Untitled Screenplay"}”? This can't be undone.`;$("confirm").hidden=false};
$("cfNo").onclick=()=>$("confirm").hidden=true;
$("cfYes").onclick=async()=>{$("confirm").hidden=true;const id=curId;delete scripts[id];curId=null;lsSave();if(sess)rest("DELETE","?id=eq."+encodeURIComponent(id)).catch(()=>{});render(true)};

/* ---------- model <-> DOM ---------- */
function mk(t,x){const p=document.createElement("p");p.dataset.t=t;p.dataset.label=LABEL[t];p.textContent=x||"";if(!x)p.append(document.createElement("br"));return p}
function txt(p){return p.textContent.replace(/ /g," ")}
function readModel(){return [...ed.children].map(p=>({t:p.dataset.t||"action",x:txt(p)}))}
function loadModel(m){ed.textContent="";(m.length?m:[{t:"scene",x:""}]).forEach(e=>ed.append(mk(e.t,e.x)))}
function curP(){const s=getSelection();if(!s.rangeCount)return null;let n=s.anchorNode;while(n&&n.parentNode!==ed)n=n.parentNode;return n&&n.nodeName==="P"?n:null}
function caretOff(p){const s=getSelection();if(!s.rangeCount)return 0;const r=s.getRangeAt(0).cloneRange();r.selectNodeContents(p);r.setEnd(s.anchorNode,s.anchorOffset);return r.toString().length}
function setCaret(p,off){const r=document.createRange();let n=p.firstChild;
  if(!n||n.nodeType!==3){r.setStart(p,0)}else{off=Math.min(off,n.length);r.setStart(n,off)}
  r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);markCur()}
function setText(p,x,off){p.textContent=x;if(!x)p.append(document.createElement("br"));setCaret(p,off==null?x.length:off)}
function setType(p,t){p.dataset.t=t;p.dataset.label=LABEL[t];
  if(t==="paren"){let x=txt(p).trim();if(!x.startsWith("("))x="("+x;if(!x.endsWith(")"))x+=")";setText(p,x,x.length-1)}
  else if(p.dataset.wasParen){}
  markCur();}
function focusEnd(){const p=ed.lastElementChild;ed.focus();setCaret(p,txt(p).length)}
function markCur(){const p=curP();[...ed.querySelectorAll("p.cur")].forEach(e=>e!==p&&e.classList.remove("cur"));if(p){p.classList.add("cur");$("type").value=p.dataset.t}}
document.addEventListener("selectionchange",()=>{if(document.activeElement===ed){markCur();}});
$("type").onchange=()=>{const p=ed.querySelector("p.cur")||ed.lastElementChild;snap(true);ed.focus();setCaret(p,txt(p).length);stripParen(p);setType(p,$("type").value);scheduleSave()};
function stripParen(p){if(p.dataset.t==="paren"){const x=txt(p).replace(/^\(/,"").replace(/\)$/,"");setText(p,x)}}

/* ---------- undo ---------- */
function state(){const p=curP();return{m:readModel(),i:p?[...ed.children].indexOf(p):0,o:p?caretOff(p):0}}
function snap(force){const s=JSON.stringify(state());if(!force&&undoS.length&&JSON.stringify(undoS[undoS.length-1])===s)return;undoS.push(JSON.parse(s));if(undoS.length>300)undoS.shift();redoS=[]}
function restore(s){loadModel(s.m);const p=ed.children[Math.min(s.i,ed.children.length-1)];ed.focus();setCaret(p,s.o);scheduleSave()}
function undo(){if(!undoS.length)return;redoS.push(state());restore(undoS.pop())}
function redo(){if(!redoS.length)return;undoS.push(state());restore(redoS.pop())}
$("undo").onclick=undo;$("redo").onclick=redo;

/* ---------- smart text ---------- */
function knownChars(){const c=new Map();[...ed.children].forEach(p=>{if(p.dataset.t==="character"&&!p.classList.contains("cur")){const n=txt(p).replace(/\s*\(.*\)\s*$/,"").trim().toUpperCase();if(n)c.set(n,(c.get(n)||0)+1)}});return[...c.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0])}
function knownLocs(){const s=new Set();[...ed.children].forEach(p=>{if(p.dataset.t==="scene"&&!p.classList.contains("cur")){const m=txt(p).toUpperCase().match(/^(?:INT\.\/EXT\.|INT\.|EXT\.|I\/E\.?)\s*(.*?)(?:\s+-\s+.*)?$/);if(m&&m[1])s.add(m[1].trim())}});return[...s]}
function suggestions(p){
  const t=p.dataset.t,x=txt(p),u=x.toUpperCase();
  if(t==="character"){if(!u.trim())return[];return knownChars().filter(n=>n.startsWith(u.trim())&&n!==u.trim()).slice(0,6).map(n=>({v:n,l:n}))}
  if(t==="transition"){return TRANS.filter(n=>n.startsWith(u.trim())&&n!==u.trim()).map(n=>({v:n,l:n}))}
  if(t==="scene"){
    const dash=u.lastIndexOf(" - ");
    if(dash>=0){const part=u.slice(dash+3);return TIMES.filter(n=>n.startsWith(part)&&n!==part).map(n=>({v:x.slice(0,dash+3)+n,l:n}))}
    const m=u.match(/^(INT\.\/EXT\.|INT\.|EXT\.)\s*(.*)$/);
    if(m){const loc=m[2];if(!loc)return knownLocs().slice(0,6).map(n=>({v:m[1]+" "+n,l:n}));return knownLocs().filter(n=>n.startsWith(loc)&&n!==loc).slice(0,6).map(n=>({v:m[1]+" "+n,l:n}))}
    if(u.trim().length<=4)return PREFIX.filter(n=>n.startsWith(u.trimStart())&&n!==u).map(n=>({v:n,l:n.trim()}));
  }
  return[];
}
let sugg=[],sel=0;
function showPop(){
  const p=curP();if(!p||getSelection().toString()){hidePop();return}
  if(caretOff(p)!==txt(p).length){hidePop();return}
  sugg=suggestions(p);if(!sugg.length){hidePop();return}
  sel=0;drawPop();const r=getSelection().getRangeAt(0).getBoundingClientRect();const pr=p.getBoundingClientRect();
  const P=$("pop");P.hidden=false;P.style.left=Math.min((r.left||pr.left),innerWidth-310)+"px";P.style.top=((r.bottom||pr.bottom)+6)+"px";
}
function drawPop(){const P=$("pop");P.textContent="";sugg.forEach((s,i)=>{const d=document.createElement("div");d.textContent=s.l;if(i===sel)d.className="on";d.onmousedown=e=>{e.preventDefault();sel=i;accept()};P.append(d)});const h=document.createElement("div");h.className="hint";h.textContent="Tab or Return to accept · Esc to dismiss";P.append(h)}
function hidePop(){$("pop").hidden=true;sugg=[]}
function accept(){const p=curP();if(!p||!sugg[sel])return false;const v=sugg[sel].v;if(v===txt(p)){hidePop();return false}snap(true);setText(p,v);hidePop();scheduleSave();setTimeout(showPop,0);return true}

function capitalizeSentence(p){
  const t=p.dataset.t;if(t!=="action"&&t!=="dialogue")return;
  const x=txt(p),o=caretOff(p);
  // capitalize sentence starts in the text before the caret (line start, or after . ! ? + space)
  const head=x.slice(0,o).replace(/(^\s*|[.!?]\s+)([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace(/(^|\s)i(?=[\s'.,!?]|$)/g,"$1I");
  if(head!==x.slice(0,o))setText(p,head+x.slice(o),o);
}

/* ---------- keys ---------- */
ed.addEventListener("keydown",e=>{
  const p=curP();const mod=e.metaKey||e.ctrlKey;
  if(mod&&!e.altKey&&/^[1-6]$/.test(e.key)){e.preventDefault();if(p){snap(true);stripParen(p);setType(p,TYPES[+e.key-1]);scheduleSave()}return}
  if(mod&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==="y"){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();saveNow();return}
  if(!$("pop").hidden){
    if(e.key==="ArrowDown"){e.preventDefault();sel=(sel+1)%sugg.length;drawPop();return}
    if(e.key==="ArrowUp"){e.preventDefault();sel=(sel-1+sugg.length)%sugg.length;drawPop();return}
    if(e.key==="Escape"){e.preventDefault();hidePop();return}
    if((e.key==="Tab"&&!e.shiftKey)||(e.key==="Enter"&&!e.shiftKey)){if(accept()){e.preventDefault();return}}
  }
  if(!p)return;
  if(e.key==="Tab"){e.preventDefault();snap(true);const t=p.dataset.t;let n;
    if(!e.shiftKey&&!txt(p).trim()){ // empty line: Writer-style cycle
      n={action:"character",character:"transition",transition:"scene",scene:"action",dialogue:"paren",paren:"dialogue"}[t];
    }else n=TYPES[(TYPES.indexOf(t)+(e.shiftKey?TYPES.length-1:1))%TYPES.length];
    stripParen(p);setType(p,n);scheduleSave();hidePop();return}
  if(e.key==="Enter"){e.preventDefault();hidePop();snap(true);
    const x=txt(p),o=caretOff(p),t=p.dataset.t;
    if(e.shiftKey){setText(p,x.slice(0,o)+"\n"+x.slice(o),o+1);scheduleSave();return}
    if(!x.trim()&&t!=="action"){stripParen(p);setType(p,"action");scheduleSave();return}   // empty non-action: drop to action
    let head=x.slice(0,o),tail=x.slice(o),nt=NEXT[t];
    if(t==="paren"&&tail===")"){head=x;tail=""}
    if(t==="scene"&&!tail&&/\s-\s*$/.test(head)){}
    setText(p,head);if(!head)p.textContent="",p.append(document.createElement("br"));
    const np=mk(nt,"");p.after(np);
    if(nt==="paren"){setType(np,"paren")}else setText(np,tail,0);
    if(tail&&nt!=="paren")setCaret(np,0);
    np.scrollIntoView({block:"nearest"});scheduleSave();return}
  if(e.key==="Backspace"&&p&&caretOff(p)===0&&!getSelection().toString()){
    const prev=p.previousElementSibling;e.preventDefault();snap(true);
    if(!prev){if(p.dataset.t!=="scene"&&!txt(p)){setType(p,"scene")}return}
    if(p.dataset.t==="paren"&&txt(p)==="()"){p.remove();setCaret(prev,txt(prev).length);scheduleSave();return}
    const px=txt(prev),x=txt(p);setText(prev,px+x,px.length);p.remove();scheduleSave();return}
  if(e.key===" "&&p.dataset.t==="character"&&false){}
  // snapshot at word boundaries for undo
  if(e.key===" "||e.key==="."){snap()}
  else{clearTimeout(snapT);snapT=setTimeout(()=>snap(),900)}
});
ed.addEventListener("beforeinput",e=>{
  if(e.inputType==="historyUndo"){e.preventDefault();undo()}else if(e.inputType==="historyRedo"){e.preventDefault();redo()}
  const p=curP();if(!p)return;
  // auto "()" — typing "(" on empty action/dialogue line starts a parenthetical
  if(e.inputType==="insertText"&&e.data==="("&&!txt(p).trim()&&(p.dataset.t==="dialogue"||p.dataset.t==="action"&&p.previousElementSibling&&/character|dialogue/.test(p.previousElementSibling.dataset.t))){e.preventDefault();snap(true);setType(p,"paren");scheduleSave()}
  if(e.inputType==="insertText"&&e.data===")"&&p.dataset.t==="paren"){const x=txt(p),o=caretOff(p);if(x[o]===")"){e.preventDefault();setCaret(p,o+1)}}
});
ed.addEventListener("input",()=>{
  // normalize: every child must be a typed <p>
  [...ed.childNodes].forEach(n=>{if(n.nodeName!=="P"){const p=mk("action",n.textContent);n.replaceWith(p);if(n.nodeType===3)setCaret(p,txt(p).length)}else if(!n.dataset.t){n.dataset.t="action";n.dataset.label=LABEL.action}});
  if(!ed.children.length){ed.append(mk("scene",""));setCaret(ed.firstChild,0)}
  const p=curP();if(p){
    const x=txt(p);
    // auto "()" when a line under a character starts with "("
    if(/^\((?!.*\))/.test(x)&&(p.dataset.t==="dialogue"||(p.dataset.t==="action"&&p.previousElementSibling&&/character|dialogue|paren/.test(p.previousElementSibling.dataset.t)))){setType(p,"paren");showPop();scheduleSave();return}
    // auto-detect scene heading / transition while typing in Action
    if(p.dataset.t==="action"&&/^(int|ext|int\.\/ext|i\/e)\.\s/i.test(x)){setType(p,"scene")}
    else if(p.dataset.t==="action"&&/^[A-Z ]+ TO:$/.test(x)){setType(p,"transition")}
    capitalizeSentence(p);
  }
  showPop();scheduleSave();
});
ed.addEventListener("paste",e=>{
  e.preventDefault();const t=(e.clipboardData.getData("text/plain")||"").replace(/\r/g,"");if(!t)return;snap(true);
  const p=curP();if(!p)return;const o=caretOff(p),x=txt(p);
  if(!t.includes("\n")){setText(p,x.slice(0,o)+t+x.slice(o),o+t.length);scheduleSave();return}
  const m=fromFountain(t);setText(p,x.slice(0,o)+m[0].x+"");if(m.length>1){let last=p;m.slice(1).forEach(el=>{const n=mk(el.t,el.x);last.after(n);last=n});setCaret(last,txt(last).length)}
  scheduleSave();
});
ed.addEventListener("blur",()=>setTimeout(hidePop,150));

/* ---------- Fountain ---------- */
function toFountain(m){
  const out=[];const title=curId&&scripts[curId]?($("title").value||scripts[curId].title||""):"";
  if(title)out.push("Title: "+title,"");
  m.forEach((e,i)=>{const x=e.x;const prev=m[i-1];
    const blankBefore=!(e.t==="dialogue"||e.t==="paren")||!prev;
    if(blankBefore&&out.length&&out[out.length-1]!=="")out.push("");
    if(e.t==="scene")out.push(/^(INT|EXT|EST|INT\.\/EXT|I\/E)[ .]/i.test(x)?x.toUpperCase():"."+x.toUpperCase());
    else if(e.t==="character"){const nx=m[i+1];const lone=!nx||!/dialogue|paren/.test(nx.t)||!nx.x.trim();out.push(lone||!/[A-Z]/i.test(x)?"@"+x.toUpperCase():x.toUpperCase())}
    else if(e.t==="transition"){const u=x.toUpperCase();out.push(/TO:$/.test(u)?u:"> "+u)}
    else if(e.t==="paren")out.push(x.startsWith("(")?x:"("+x+")");
    else if(e.t==="dialogue")out.push(x||" ");
    else{const looksSpecial=/^(INT|EXT|EST|I\/E)[ .]/i.test(x)||(/^[A-Z0-9 ]+$/.test(x)&&/[A-Z]/.test(x))||/^[.>@!~=#]/.test(x);out.push(looksSpecial?"!"+x:x)}
  });
  return out.join("\n").trim()+"\n";
}
function fromFountain(src){
  let lines=src.replace(/\r/g,"").split("\n");const m=[];let title="";
  // title page
  if(/^[A-Za-z ]+:\s*/.test(lines[0]||"")&&!/^(INT|EXT)/i.test(lines[0])){
    let i=0;while(i<lines.length&&lines[i].trim()!==""){const tm=lines[i].match(/^title:\s*(.*)$/i);if(tm)title=tm[1].trim();i++}lines=lines.slice(i);
  }
  fromFountain.lastTitle=title;
  const blocks=[];let cur=[];lines.forEach(l=>{if(l.trim()===""&&!/^ {2}$/.test(l)){if(cur.length)blocks.push(cur),cur=[]}else cur.push(l)});if(cur.length)blocks.push(cur);
  blocks.forEach(b=>{
    const f=b[0].trim();
    if(/^#|^=(?!=)|^\[\[/.test(f)&&b.length===1)return;
    if(/^\.[^.]/.test(f)){m.push({t:"scene",x:f.slice(1).trim()});return}
    if(/^(INT|EXT|EST|INT\.\/EXT|INT\/EXT|I\/E)[ .]/i.test(f)&&b.length===1){m.push({t:"scene",x:f.replace(/\s+#.*#$/,"")});return}
    if(/^>/.test(f)&&!/<$/.test(f)&&b.length===1){m.push({t:"transition",x:f.slice(1).trim()});return}
    if(/^[A-Z0-9 .'\-]+TO:$/.test(f)&&b.length===1){m.push({t:"transition",x:f});return}
    if(b.length===1&&/^(FADE OUT\.|FADE TO BLACK\.|FADE IN:)$/.test(f)){m.push({t:"transition",x:f});return}
    if(b.length===1&&/^@/.test(f)){m.push({t:"character",x:f.slice(1)});return}
    const isChar=b.length>1&&(f.startsWith("@")||(/^[^a-z]*[A-Z][^a-z]*$/.test(f.replace(/\(.*\)/,""))&&!f.startsWith("!")));
    if(isChar){m.push({t:"character",x:f.replace(/^@/,"").replace(/\s*\^$/,"")});
      b.slice(1).forEach(l=>{const s=l.trim();if(/^\(.*\)$/.test(s))m.push({t:"paren",x:s});else if(m[m.length-1].t==="dialogue")m[m.length-1].x+="\n"+s;else m.push({t:"dialogue",x:s})});return}
    m.push({t:"action",x:b.map(l=>l.replace(/^!/,"")).join("\n")});
  });
  return m;
}
let sheetMode="";
function sheet(mode){sheetMode=mode;$("sheet").hidden=false;const imp=mode==="import";
  $("shTitle").textContent=imp?"Import Fountain":"Export Fountain";$("shOk").hidden=!imp;$("shFile").hidden=!imp;$("shCopy").hidden=imp;$("shSave").hidden=imp;
  $("shText").value=imp?"":toFountain(readModel());$("shText").readOnly=!imp;
  $("shNote").textContent=imp?"Paste Fountain text or open a .fountain file exported from Quill for Mac.":"Copy this, or download a .fountain file to open in Quill for Mac.";
  setTimeout(()=>$("shText").focus(),0)}
$("imp").onclick=()=>sheet("import");$("exp").onclick=()=>sheet("export");
$("shCancel").onclick=()=>{$("sheet").hidden=true;ed.focus()};
$("shFile").onclick=()=>$("file").click();
$("file").onchange=async()=>{const f=$("file").files[0];if(f){$("shText").value=await f.text();$("file").value=""}};
$("shOk").onclick=()=>{const t=$("shText").value;if(!t.trim())return;const m=fromFountain(t);$("sheet").hidden=true;saveT&&saveNow();newScript(m,fromFountain.lastTitle||"Imported Script")};
$("shCopy").onclick=async()=>{try{await navigator.clipboard.writeText($("shText").value);$("shNote").textContent="Copied."}catch(e){$("shText").select();$("shNote").textContent="Press Ctrl/⌘ C to copy the selected text."}};
$("shSave").onclick=async()=>{const name=($("title").value||"Untitled Screenplay").replace(/[^\w\- ]+/g,"")+".fountain";
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("shText").value],{type:"text/plain"}));a.download=name;document.body.append(a);a.click();a.remove();$("shNote").textContent="Downloaded "+name};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("sheet").hidden=true;$("confirm").hidden=true;$("auth").hidden=true}});

$("acct").onclick=showAuth;$("auLater").onclick=()=>$("auth").hidden=true;
$("auIn").onclick=()=>doAuth(false);$("auNew").onclick=()=>doAuth(true);
$("auPw").onkeydown=e=>{if(e.key==="Enter")doAuth(false)};
$("auOut").onclick=()=>{sess=null;sessSave();try{localStorage.removeItem(LS)}catch(e){};scripts={};curId=null;$("auth").hidden=true;render(true);setWhere("Signed out – nothing kept in this browser")};
boot();
